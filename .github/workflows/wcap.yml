name: wcap

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (${{ matrix.arch }})
        shell: cmd
        run: build.cmd ${{ matrix.arch }}

      - name: Upload wcap-${{ matrix.arch }}.exe
        uses: actions/upload-artifact@v4
        with:
          name: wcap-${{ matrix.arch }}
          path: wcap-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30
